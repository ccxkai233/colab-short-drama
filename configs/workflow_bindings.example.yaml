# 工作流节点绑定配置示例（已按 ComfyUI 0.46.0 原生节点接口校准，主力支持 MiniMax H3 + FLUX）
#
# 使用方法：
#   1. 复制本文件为 configs/workflow_bindings.yaml
#   2. 如自定义了 ComfyUI 工作流，对照 Save (API Format) JSON 中的节点 ID 更新下方映射即可
#
# 字段绑定支持：
#   node_id:         目标节点 ID（字符串，或列表一次写入多个节点）
#   input:           节点 inputs 字典下的字段名
#   upload:          (可选) true 表示本地文件路径，提交前自动上传到云端 input/
#   type:            (可选) int | float | str | bool | h3_frames(对齐17k+5) | h3_seconds(秒数转24fps 17k+5帧)
#   align:           (可选) 整数对齐步长（MiniMax H3 宽高必须对齐 32）
#   connect_to:      (可选) 有值时自动连线到目标节点端口
#   prune_nodes:     (可选) 无值时自动裁剪未使用的占位节点
#   boolean_connect: (可选) 布尔字段为 true 时自动连线（如 R2V 参考视频音轨）

tasks:
  h3_t2va:
    workflow: "workflows/h3_fl2va_api.json"
    output_prefix_node:
      node_id: "92"
      input: "filename_prefix"
    bindings:
      prompt:
        node_id: "30"
        input: "prompt"
      seed:
        node_id: "15"
        input: "noise_seed"
        type: "int"
      width:
        node_id: "30"
        input: "width"
        type: "int"
        align: 32
      height:
        node_id: "30"
        input: "height"
        type: "int"
        align: 32
      duration_sec:
        node_id: "30"
        input: "length"
        type: "h3_seconds"
      length:
        node_id: "30"
        input: "length"
        type: "h3_frames"
      steps:
        node_id: "9"
        input: "steps"
        type: "int"
      first_frame:
        node_id: "50"
        input: "image"
        upload: true
        connect_to:
          node_id: "30"
          input: "first_frame"
          slot: 0
        prune_nodes: ["50"]
      last_frame:
        node_id: "51"
        input: "image"
        upload: true
        connect_to:
          node_id: "30"
          input: "last_frame"
          slot: 0
        prune_nodes: ["51"]

